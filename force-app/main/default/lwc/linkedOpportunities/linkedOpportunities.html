<template>
    <template if:true={opportunities}>
        <div class="slds-var-m-around_medium">
            <h1 class="slds-text-heading_medium">Linked Opportunities</h1>
        </div>
        <template for:each={opportunities} for:item="opp">
            <div class="slds-var-p-around_medium lgc-bg slds-box slds-theme_default slds-var-m-bottom_medium" key={opp.Id}>
                <lightning-tile label="Opportunity" href="">
                    <dl class="slds-dl_horizontal">
                        <dt class="slds-dl_horizontal__label">
                            <p class="slds-truncate slds-text-title_bold">Opportunity Name:</p>
                        </dt>
                        <dd class="slds-dl_horizontal__detail slds-tile__meta">
                            <p class="slds-truncate">{opp.Name}</p>
                        </dd>
                        <dt class="slds-dl_horizontal__label">
                            <p class="slds-truncate slds-text-title_bold">Account Name:</p>
                        </dt>
                        <dd class="slds-dl_horizontal__detail slds-tile__meta">
                            <p class="slds-truncate">{opp.Account.Name}</p>
                        </dd>
                        <dt class="slds-dl_horizontal__label">
                            <p class="slds-truncate slds-text-title_bold">Amount:</p>
                        </dt>
                        <dd class="slds-dl_horizontal__detail slds-tile__meta">
                            <p class="slds-truncate">{opp.Amount}</p>
                        </dd>
                        <dt class="slds-dl_horizontal__label">
                            <p class="slds-truncate slds-text-title_bold">Stage:</p>
                        </dt>
                        <dd class="slds-dl_horizontal__detail slds-tile__meta">
                            <p class="slds-truncate">{opp.StageName}</p>
                        </dd>
                        <dt class="slds-dl_horizontal__label">
                            <p class="slds-truncate slds-text-title_bold">Opportunity Owner:</p>
                        </dt>
                        <dd class="slds-dl_horizontal__detail slds-tile__meta">
                            <p class="slds-truncate">{opp.Owner.Name}</p>
                        </dd>
                    </dl>
                </lightning-tile>
            </div>
        </template>
    </template>
</template>
